<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1340" viewBox="0 0 1000 1340" role="img" aria-labelledby="title desc"><title id="title">SO-101 작동 화면과 기록 대시보드</title><desc id="desc">실시간 작동 패널, 실행 기록 대시보드, MuJoCo 미러의 역할과 실제 6축 관절 로그를 보여준다.</desc><rect x="0" y="0" width="1000" height="1340" fill="#ECEFF2" stroke="#ECEFF2" stroke-width="0"></rect><text x="46" y="58" font-size="23" fill="#556069" font-weight="700" text-anchor="start" font-family="&#x27;Noto Sans Mono CJK KR&#x27;,&#x27;Martian Mono&#x27;,monospace" letter-spacing="1.5">TWO WEB SURFACES / ONE RUN RECORD</text><text x="46" y="126" font-size="40" fill="#12171C" font-weight="800" text-anchor="start" font-family="&#x27;Noto Sans CJK KR&#x27;,&#x27;Wanted Sans&#x27;,Arial,sans-serif">작동 화면과 기록 대시보드를 분리했습니다.</text><line x1="46" y1="160" x2="954" y2="160" stroke="#12171C" stroke-width="4"></line><rect x="46" y="202" width="908" height="132" fill="#FAFBFC" stroke="#D3DAE0" stroke-width="2"></rect><text x="70" y="240" font-size="20" fill="#556069" font-weight="700" text-anchor="start" font-family="&#x27;Noto Sans Mono CJK KR&#x27;,&#x27;Martian Mono&#x27;,monospace" letter-spacing="1">01 / WEB UI · /state + /cmd</text><text x="70" y="282" font-size="30" fill="#12171C" font-weight="800" text-anchor="start" font-family="&#x27;Noto Sans CJK KR&#x27;,&#x27;Wanted Sans&#x27;,Arial,sans-serif">실시간 작동 패널</text><text x="70" y="314" font-size="22" fill="#556069" font-weight="550" text-anchor="start" font-family="&#x27;Noto Sans CJK KR&#x27;,&#x27;Wanted Sans&#x27;,Arial,sans-serif">명령 · 토크 · 정지 · 미션 상태</text><rect x="46" y="362" width="908" height="132" fill="#FAFBFC" stroke="#D3DAE0" stroke-width="2"></rect><text x="70" y="400" font-size="20" fill="#556069" font-weight="700" text-anchor="start" font-family="&#x27;Noto Sans Mono CJK KR&#x27;,&#x27;Martian Mono&#x27;,monospace" letter-spacing="1">02 / WEB UI · runs.json</text><text x="70" y="442" font-size="30" fill="#12171C" font-weight="800" text-anchor="star