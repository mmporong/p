<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title desc">
  <title id="title">AMR 기체 브링업 데이터 흐름 태블릿 배치</title>
  <desc id="desc">ROS 2 속도 명령이 Raspberry Pi C++ 드라이버와 UART를 거쳐 ESP32와 바퀴로 전달되고, 엔코더와 센서 상태가 반대 방향으로 돌아오는 흐름을 태블릿 폭에 맞춰 위아래로 정리했다.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12171c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6b4a"/>
    </marker>
    <style>
      .title { font: 700 40px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #12171c; letter-spacing: -0.8px; }
      .panel-title { font: 700 32px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #12171c; letter-spacing: -0.5px; }
      .lead { font: 650 26px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #2b3339; }
      .body { font: 500 24px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #2b3339; }
      .small { font: 500 22px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #556069; }
      .mono { font: 600 24px "Martian Mono", "IBM Plex Mono", monospace; fill: #12171c; }
      .green { fill: #1f6b4a; }
      .panel { fill: #fafbfc; stroke: #12171c; stroke-width: 2.5; }
      .soft { fill: #e3ebf1; stroke: #c2cfd9; stroke-width: 2; }
      .hardware { fill: #fafbfc; stroke: #7d8992; stroke-width: 2; }
      .rule { stroke: #d3dae0; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1000" height="1080" fill="#f5f7f9"/>
  <line x1="52" y1="72" x2="948" y2="72" stroke="#12171c" stroke-width="3"/>
  <text class="title" x="52" y="52">기체 브링업에서 실제로 오가는 데이터</text>

  <rect class="panel" x="52" y="104" width="896" height="252"/>
  <text class="panel-title" x="84" y="148">Raspberry Pi 4 · ROS 2</text>
  <text class="lead" x="84" y="184">C++ base driver</text>
  <line class="rule" x1="84" y1="204" x2="916" y2="204"/>
  <rect class="soft" x="84" y="226" width="210" height="48" rx="4"/>
  <text class="mono" x="108" y="259">/cmd_vel 입력</text>
  <text class="body" x="84" y="310">역기구학 · 비율 보존 포화</text>
  <text class="small" x="84" y="340">실측 r 0.0329 m · b 0.1836 m</text>
  <text class="lead" x="452" y="242">ROS 2 발행</text>
  <text class="mono" x="452" y="278">/odom 50 Hz · TF 20 Hz</text>
  <text class="mono" x="452" y="312">/imu/data_raw · /imu/mag 50 Hz</text>
  <text class="mono" x="452" y="346">/battery_state 1 Hz</text>

  <rect class="hardware" x="52" y="378" width="896" height="104"/>
  <text class="panel-title" x="84" y="422">YDLIDAR G4</text>
  <text class="lead" x="312" y="422">USB → ROS 2 driver → /scan</text>
  <text class="small" x="84" y="460">laser_link 고정 TF는 URDF가 제공 · 라이다 데이터는 ESP32를 거치지 않음</text>

  <rect class="soft" x="52" y="504" width="896" height="184" rx="4"/>
  <text class="lead" text-anchor="middle" x="500" y="542">40핀 UART · /dev/ttyS0 · 115200</text>
  <text class="lead" x="84" y="590">명령 프레임 · 50 Hz</text>
  <line x1="320" y1="582" x2="626" y2="582" stroke="#12171c" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text class="small" x="662" y="574">좌·우 목표속도 [counts/s]</text>
  <text class="small" x="662" y="602">STOP · REBOOT · CRC-8</text>
  <text class="lead green" x="84" y="648">상태 프레임 · 50 Hz</text>
  <line x1="626" y1="640" x2="320" y2="640" stroke="#1f6b4a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text class="small green" x="662" y="632">seq · 누적 엔코더 · 9축 IMU</text>
  <text class="small green" x="662" y="660">배터리 mV · flags · CRC-8</text>

  <rect class="panel" x="52" y="710" width="896" height="174"/>
  <text class="panel-title" x="84" y="754">ESP32 firmware v2</text>
  <text class="lead" x="84" y="790">프레임 파서 · 400 ms watchdog</text>
  <line class="rule" x1="84" y1="810" x2="916" y2="810"/>
  <text class="body" x="84" y="846">좌·우 바퀴 지령 · 12-bit 엔코더 언랩</text>
  <text class="body" x="524" y="846">바이트 재동기 · 센서 상태 flags</text>
  <path d="M 344 884 V 910" fill="none" stroke="#12171c" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <path d="M 430 910 V 884" fill="none" stroke="#1f6b4a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M 690 910 V 884" fill="none" stroke="#1f6b4a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M 786 884 V 910" fill="none" stroke="#12171c" stroke-width="4" marker-end="url(#arrow-dark)"/>

  <rect class="hardware" x="52" y="910" width="520" height="116"/>
  <text class="panel-title" x="84" y="952">STS3215 ×2</text>
  <text class="body" x="84" y="988">속도 지령 ↓ · 12-bit 위치 ↑</text>
  <text class="small" x="84" y="1018">왼쪽 ID2 · 오른쪽 ID1 · 서보 버스 1 Mbps</text>

  <rect class="hardware" x="592" y="910" width="356" height="116"/>
  <text class="panel-title" x="624" y="952">I²C 센서 ↑ · 화면 ↓</text>
  <text class="small" x="624" y="988">QMI8658C · AK09918 · INA219</text>
  <text class="small" x="624" y="1018">SSD1306 상태 화면 ↓</text>

  <text class="small" text-anchor="middle" x="500" y="1060">검은 화살표: 명령 · 초록 화살표: 측정값과 상태</text>
</svg>
