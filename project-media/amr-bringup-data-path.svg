<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AMR 기체 브링업 데이터 흐름</title>
  <desc id="desc">ROS 2 속도 명령은 Raspberry Pi의 C++ 드라이버에서 좌우 바퀴 속도로 변환돼 ESP32로 전달된다. ESP32가 보낸 엔코더, 9축 IMU, 배터리, 상태 플래그는 Raspberry Pi에서 오도메트리, TF, IMU, 자력계, 배터리 토픽으로 발행된다. G4 라이다는 별도 USB 경로로 스캔을 발행한다.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12171c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6b4a"/>
    </marker>
    <style>
      .title { font: 700 34px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #12171c; letter-spacing: -0.7px; }
      .panel-title { font: 700 30px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #12171c; letter-spacing: -0.5px; }
      .lead { font: 650 24px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #2b3339; }
      .body { font: 500 22px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #2b3339; }
      .small { font: 500 20px "Wanted Sans", "Noto Sans KR", sans-serif; fill: #556069; }
      .mono { font: 600 21px "Martian Mono", "IBM Plex Mono", monospace; fill: #12171c; }
      .green { fill: #1f6b4a; }
      .panel { fill: #fafbfc; stroke: #12171c; stroke-width: 2.5; }
      .soft { fill: #e3ebf1; stroke: #c2cfd9; stroke-width: 2; }
      .hardware { fill: #fafbfc; stroke: #7d8992; stroke-width: 2; }
      .rule { stroke: #d3dae0; stroke-width: 2; }
      .wire { fill: none; stroke: #7d8992; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f5f7f9"/>
  <line x1="72" y1="72" x2="1528" y2="72" stroke="#12171c" stroke-width="3"/>
  <text class="title" x="72" y="50">기체 브링업에서 실제로 오가는 데이터</text>

  <rect class="panel" x="72" y="116" width="545" height="470"/>
  <text class="panel-title" x="110" y="166">Raspberry Pi 4 · ROS 2</text>
  <text class="lead" x="110" y="208">C++ base driver</text>
  <line class="rule" x1="110" y1="232" x2="579" y2="232"/>

  <rect class="soft" x="110" y="260" width="205" height="58" rx="4"/>
  <text class="mono" x="134" y="297">/cmd_vel 입력</text>
  <text class="body" x="110" y="356">차동구동 역기구학 · 비율 보존 포화</text>
  <text class="small" x="110" y="392">실측 파라미터  r 0.0329 m · b 0.1836 m</text>

  <text class="lead" x="110" y="442">ROS 2 발행</text>
  <text class="mono" x="110" y="480">/odom 50 Hz · TF 20 Hz</text>
  <text class="mono" x="110" y="518">/imu/data_raw · /imu/mag 50 Hz</text>
  <text class="mono" x="110" y="556">/battery_state 1 Hz</text>

  <rect class="panel" x="983" y="116" width="545" height="470"/>
  <text class="panel-title" x="1021" y="166">ESP32 firmware v2</text>
  <text class="lead" x="1021" y="208">프레임 파서 · 400 ms watchdog</text>
  <line class="rule" x1="1021" y1="232" x2="1490" y2="232"/>

  <text class="body" x="1021" y="282">좌·우 바퀴 속도를 부호 있는 값으로 처리</text>
  <text class="body" x="1021" y="328">STS3215 위치를 12-bit 누적값으로 언랩</text>
  <text class="body" x="1021" y="374">CRC 오류 뒤 바이트 단위로 재동기</text>
  <text class="body" x="1021" y="420">서보·IMU·전압 상태를 flags로 함께 전송</text>

  <rect class="soft" x="1021" y="465" width="469" height="82" rx="4"/>
  <text class="lead" x="1049" y="498">명령 두절 시 정지</text>
  <text class="small" x="1049" y="530">첫 유효 명령 전 정지 · 400 ms 무명령 정지</text>

  <rect class="soft" x="650" y="152" width="300" height="398" rx="4"/>
  <text class="lead" text-anchor="middle" x="800" y="196">40핀 UART</text>
  <text class="mono" text-anchor="middle" x="800" y="226">/dev/ttyS0 · 115200</text>

  <text class="lead" text-anchor="middle" x="800" y="276">명령 프레임 · 50 Hz</text>
  <line x1="671" y1="309" x2="929" y2="309" stroke="#12171c" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text class="small" text-anchor="middle" x="800" y="346">좌·우 목표속도 [counts/s]</text>
  <text class="small" text-anchor="middle" x="800" y="374">STOP · REBOOT · CRC-8</text>

  <text class="lead green" text-anchor="middle" x="800" y="428">상태 프레임 · 50 Hz</text>
  <line x1="929" y1="461" x2="671" y2="461" stroke="#1f6b4a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text class="small green" text-anchor="middle" x="800" y="498">seq · 누적 엔코더 · 9축 IMU</text>
  <text class="small green" text-anchor="middle" x="800" y="526">배터리 mV · 상태 flags · CRC-8</text>

  <path d="M 250 626 V 586" fill="none" stroke="#1f6b4a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect class="hardware" x="72" y="626" width="545" height="188"/>
  <text class="panel-title" x="110" y="676">YDLIDAR G4</text>
  <text class="lead" x="110" y="718">USB → ROS 2 driver → /scan</text>
  <text class="body" x="110" y="758">laser_link 고정 TF는 URDF가 제공</text>
  <text class="small" x="110" y="794">라이다 데이터는 ESP32를 거치지 않는다</text>

  <path d="M 1095 586 V 626" fill="none" stroke="#12171c" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <path d="M 1225 626 V 586" fill="none" stroke="#1f6b4a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect class="hardware" x="983" y="626" width="315" height="188"/>
  <text class="panel-title" x="1021" y="676">STS3215 ×2</text>
  <text class="body" x="1021" y="718">속도 지령 ↓ · 12-bit 위치 ↑</text>
  <text class="body" x="1021" y="758">왼쪽 ID2 · 오른쪽 ID1</text>
  <text class="small" x="1021" y="794">서보 버스 1 Mbps</text>

  <path d="M 1360 626 V 586" fill="none" stroke="#1f6b4a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect class="hardware" x="1318" y="626" width="210" height="112"/>
  <text class="lead" x="1342" y="668">I²C 센서 ↑</text>
  <text class="small" x="1342" y="704">QMI8658C · AK09918</text>
  <text class="small" x="1342" y="730">INA219</text>

  <path d="M 1490 586 H 1550 V 781 H 1528" fill="none" stroke="#12171c" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <rect class="hardware" x="1318" y="758" width="210" height="56"/>
  <text class="small" x="1342" y="793">SSD1306 상태 화면 ↓</text>

  <text class="small" x="420" y="862">검은 화살표: 명령 · 초록 화살표: 측정값과 상태</text>
</svg>
